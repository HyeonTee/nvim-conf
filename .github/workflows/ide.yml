name: IDE compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ide:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Keep project Java 17 path
        run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl unzip ripgrep fd-find
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(command -v fdfind)" "$RUNNER_TEMP/bin/fd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep fd
      - name: Rust and tree-sitter
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install tree-sitter-cli --version 0.26.11 --locked
      - name: Fresh install and checks
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/ide-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/ide-config"
          export XDG_STATE_HOME="$RUNNER_TEMP/ide-state"
          export XDG_CACHE_HOME="$RUNNER_TEMP/ide-cache"
          export JAVA21_HOME="$JAVA_HOME"
          bash scripts/bootstrap.sh
          bash scripts/doctor.sh
          bash scripts/test.sh --smoke
          bash scripts/bootstrap.sh
          git diff --exit-code -- lazy-lock.json
